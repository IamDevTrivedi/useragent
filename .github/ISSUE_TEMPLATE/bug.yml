name: Bug report
description: Report a parsing error, crash, or incorrect result
title: "[bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a parser bug. Please provide the exact User-Agent
        string. Do not report security vulnerabilities here; use the private
        security advisory link instead.

  - type: textarea
    id: user-agent
    attributes:
      label: Exact User-Agent
      description: Paste the complete, unmodified User-Agent string.
      render: text
      placeholder: Mozilla/5.0 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Which fields should be detected, and with what values?
      placeholder: |
        Browser.Name = Chrome
        Device.Type = desktop
        CPU.Architecture = amd64
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the relevant parsed fields or a JSON dump.
      render: text
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version or commit
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: go1.27.2
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A small Go test or code snippet that demonstrates the issue.
      render: go
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I provided the exact and complete User-Agent string.
          required: true
        - label: This report does not contain a security vulnerability.
          required: true
