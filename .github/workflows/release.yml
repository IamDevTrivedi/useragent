name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

  build:
    name: build (${{ matrix.goos }}, ${{ matrix.goarch }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          mkdir -p dist
          output="ua_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -buildvcs=false -o "dist/${output}" ./cmd/ua
          test -s "dist/${output}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          serial="urn:uuid:$(cat /proc/sys/kernel/random/uuid)"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          version="${GITHUB_REF_NAME}"
          purl="pkg:golang/github.com/IamDevTrivedi/useragent@${version}"
          cat > dist/sbom.cdx.json <<EOF
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.5",
            "serialNumber": "${serial}",
            "version": 1,
            "metadata": {
              "timestamp": "${created}",
              "tools": {
                "components": [
                  {
                    "type": "application",
                    "name": "go",
                    "version": "$(go env GOVERSION)"
                  }
                ]
              },
              "component": {
                "type": "application",
                "bom-ref": "${purl}",
                "name": "ua",
                "version": "${version}",
                "purl": "${purl}"
              }
            },
            "components": []
          }
          EOF
          python3 -m json.tool dist/sbom.cdx.json >/dev/null

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ua_* sbom.cdx.json > checksums.txt
          cat checksums.txt

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Release %s\n' "${GITHUB_REF_NAME}" > release-notes.md
          fi
          cat release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "useragent ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest
